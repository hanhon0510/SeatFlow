services:
  postgres:
    image: postgres:16-alpine
    container_name: seatflow-postgres
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: seatflow
      POSTGRES_PASSWORD: seatflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatflow -d seatflow"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
