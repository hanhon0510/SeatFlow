spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  flyway:
    enabled: true

seatflow:
  actuator:
    # Local only: the port is not routable, and it keeps the dev dashboards working.
    metrics-public: ${SEATFLOW_ACTUATOR_METRICS_PUBLIC:true}
  kafka:
    enabled: ${SEATFLOW_KAFKA_ENABLED:true}
    topic-replicas: ${SEATFLOW_KAFKA_TOPIC_REPLICAS:1}
  outbox:
    publisher:
      enabled: ${SEATFLOW_OUTBOX_PUBLISHER_ENABLED:true}
  local-admin:
    enabled: ${SEATFLOW_LOCAL_ADMIN_ENABLED:false}
    email: ${SEATFLOW_LOCAL_ADMIN_EMAIL:}
    password: ${SEATFLOW_LOCAL_ADMIN_PASSWORD:}
