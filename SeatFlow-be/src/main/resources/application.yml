spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: seat-flow

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatflow}
    username: ${DATASOURCE_USERNAME:seatflow}
    password: ${DATASOURCE_PASSWORD:seatflow}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SEATFLOW_REDIS_HOST:localhost}
      port: ${SEATFLOW_REDIS_PORT:6379}
      password: ${SEATFLOW_REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${SEATFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: seat-flow
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.seatflow

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.seatflow
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

seatflow:
  jwt:
    secret: ${SEATFLOW_JWT_SECRET:change-me-to-a-long-random-secret}
    issuer: ${SEATFLOW_JWT_ISSUER:seatflow}
    expires-in-seconds: ${SEATFLOW_JWT_EXPIRES_IN_SECONDS:3600}
  kafka:
    enabled: ${SEATFLOW_KAFKA_ENABLED:false}
