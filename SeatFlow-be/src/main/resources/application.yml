spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: seatflow-backend

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${POSTGRES_VALIDATION_TIMEOUT_MS:1000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: ${KAFKA_ADMIN_FAIL_FAST:false}
      properties:
        request.timeout.ms: ${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}
        default.api.timeout.ms: ${KAFKA_ADMIN_DEFAULT_API_TIMEOUT_MS:5000}
    producer:
      client-id: ${KAFKA_PRODUCER_CLIENT_ID:seatflow-backend}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
    consumer:
      group-id: ${SEATFLOW_KAFKA_GROUP_ORDER_EVENTS:seatflow.order-events.consumer.v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.seatflow.kafka.EventEnvelope
        spring.json.trusted.packages: com.seatflow,java.util,java.time
        spring.json.use.type.headers: false
        request.timeout.ms: ${KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:10000}
        default.api.timeout.ms: ${KAFKA_CONSUMER_DEFAULT_API_TIMEOUT_MS:10000}
    listener:
      ack-mode: record

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.seatflow
  type-handlers-package: com.seatflow.config
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

management:
  health:
    kafka:
      enabled: ${SEATFLOW_KAFKA_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kafka

server:
  port: ${PORT}

seatflow:
  jwt:
    secret: ${SEATFLOW_JWT_SECRET}
    issuer: ${SEATFLOW_JWT_ISSUER}
    expires-in-seconds: ${SEATFLOW_JWT_EXPIRES_IN_SECONDS}
  refresh-token:
    cookie-name: ${SEATFLOW_REFRESH_TOKEN_COOKIE_NAME}
    expires-in-seconds: ${SEATFLOW_REFRESH_TOKEN_EXPIRES_IN_SECONDS}
    cookie-secure: ${SEATFLOW_REFRESH_TOKEN_COOKIE_SECURE}
    same-site: ${SEATFLOW_REFRESH_TOKEN_SAME_SITE}
  holds:
    ttl: ${SEATFLOW_HOLD_TTL:5m}
    max-seats: ${SEATFLOW_HOLD_MAX_SEATS:8}
  rate-limit:
    enabled: ${SEATFLOW_RATE_LIMIT_ENABLED:true}
    # Forwarding headers are honoured only when the peer matches trusted-proxies, so leaving
    # that list empty disables header parsing no matter what this flag says.
    trust-proxy-headers: ${SEATFLOW_RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    trusted-proxies: ${SEATFLOW_RATE_LIMIT_TRUSTED_PROXIES:}
    login:
      limit: ${SEATFLOW_RATE_LIMIT_LOGIN_LIMIT:5}
      window: ${SEATFLOW_RATE_LIMIT_LOGIN_WINDOW:1m}
    login-per-ip:
      limit: ${SEATFLOW_RATE_LIMIT_LOGIN_IP_LIMIT:30}
      window: ${SEATFLOW_RATE_LIMIT_LOGIN_IP_WINDOW:15m}
    seat-layout:
      limit: ${SEATFLOW_RATE_LIMIT_SEAT_LAYOUT_LIMIT:60}
      window: ${SEATFLOW_RATE_LIMIT_SEAT_LAYOUT_WINDOW:1m}
    register:
      limit: ${SEATFLOW_RATE_LIMIT_REGISTER_LIMIT:3}
      window: ${SEATFLOW_RATE_LIMIT_REGISTER_WINDOW:10m}
    holds:
      limit: ${SEATFLOW_RATE_LIMIT_HOLDS_LIMIT:20}
      window: ${SEATFLOW_RATE_LIMIT_HOLDS_WINDOW:1m}
    payments:
      limit: ${SEATFLOW_RATE_LIMIT_PAYMENTS_LIMIT:10}
      window: ${SEATFLOW_RATE_LIMIT_PAYMENTS_WINDOW:1m}
  idempotency:
    ttl: ${SEATFLOW_IDEMPOTENCY_TTL:24h}
  kafka:
    enabled: ${SEATFLOW_KAFKA_ENABLED:false}
    topics:
      order-events: ${SEATFLOW_KAFKA_TOPIC_ORDER_EVENTS:seatflow.order-events.v1}
      notification-events: ${SEATFLOW_KAFKA_TOPIC_NOTIFICATION_EVENTS:seatflow.notification-events.v1}
      dead-letter: ${SEATFLOW_KAFKA_TOPIC_DEAD_LETTER:seatflow.dead-letter.v1}
    consumer-groups:
      order-events: ${SEATFLOW_KAFKA_GROUP_ORDER_EVENTS:seatflow.order-events.consumer.v1}
      notification-events: ${SEATFLOW_KAFKA_GROUP_NOTIFICATION_EVENTS:seatflow.notification-events.consumer.v1}
    retry:
      max-attempts: ${SEATFLOW_KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff: ${SEATFLOW_KAFKA_RETRY_BACKOFF:1s}
    health:
      timeout: ${SEATFLOW_KAFKA_HEALTH_TIMEOUT:2s}
  outbox:
    publisher:
      enabled: ${SEATFLOW_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: ${SEATFLOW_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      retry-delay: ${SEATFLOW_OUTBOX_PUBLISHER_RETRY_DELAY:30s}
      retry-max-delay: ${SEATFLOW_OUTBOX_PUBLISHER_RETRY_MAX_DELAY:5m}
      publish-timeout: ${SEATFLOW_OUTBOX_PUBLISHER_TIMEOUT:10s}
      # How long a claimed batch stays hidden from other pollers. Must exceed publish-timeout.
      claim-lease: ${SEATFLOW_OUTBOX_PUBLISHER_CLAIM_LEASE:1m}
      # Wall-clock budget for one pass, so a broker outage cannot stall the publisher for
      # batch-size * publish-timeout.
      pass-timeout: ${SEATFLOW_OUTBOX_PUBLISHER_PASS_TIMEOUT:30s}
      fixed-delay-ms: ${SEATFLOW_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
