spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: seatflow-backend

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:seatflow}
    username: ${POSTGRES_USER:seatflow}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.seatflow
  type-handlers-package: com.seatflow.config
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

seatflow:
  jwt:
    secret: ${SEATFLOW_JWT_SECRET:}
    issuer: ${SEATFLOW_JWT_ISSUER:seatflow-backend}
    expires-in-seconds: ${SEATFLOW_JWT_EXPIRES_IN_SECONDS:900}
  refresh-token:
    cookie-name: ${SEATFLOW_REFRESH_TOKEN_COOKIE_NAME:seatflow_refresh_token}
    expires-in-seconds: ${SEATFLOW_REFRESH_TOKEN_EXPIRES_IN_SECONDS:1209600}
    cookie-secure: ${SEATFLOW_REFRESH_TOKEN_COOKIE_SECURE:false}
    same-site: ${SEATFLOW_REFRESH_TOKEN_SAME_SITE:Strict}
