spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: seatflow-backend

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.seatflow
  type-handlers-package: com.seatflow.config
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT}

seatflow:
  jwt:
    secret: ${SEATFLOW_JWT_SECRET}
    issuer: ${SEATFLOW_JWT_ISSUER}
    expires-in-seconds: ${SEATFLOW_JWT_EXPIRES_IN_SECONDS}
  refresh-token:
    cookie-name: ${SEATFLOW_REFRESH_TOKEN_COOKIE_NAME}
    expires-in-seconds: ${SEATFLOW_REFRESH_TOKEN_EXPIRES_IN_SECONDS}
    cookie-secure: ${SEATFLOW_REFRESH_TOKEN_COOKIE_SECURE}
    same-site: ${SEATFLOW_REFRESH_TOKEN_SAME_SITE}
  holds:
    ttl: ${SEATFLOW_HOLD_TTL:5m}
    max-seats: ${SEATFLOW_HOLD_MAX_SEATS:8}
  idempotency:
    ttl: ${SEATFLOW_IDEMPOTENCY_TTL:24h}
