name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SeatFlow-be
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: SeatFlow-be/pom.xml

      # The integration tests start PostgreSQL with Testcontainers, so they need the Docker daemon
      # the runner already provides. They create an empty database and run every Flyway migration
      # against it, which is also what proves the migrations apply cleanly from scratch.
      - name: Run tests
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: SeatFlow-be/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SeatFlow-fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SeatFlow-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks the whole project before bundling it.
      - name: Build
        run: npm run build

      # Shared runners are slower than a laptop, and the longest UI tests build whole admin pages,
      # so the default 10 second limit is relaxed here. Tests that set their own limit keep it.
      - name: Test
        run: npm test -- --testTimeout=30000
